    function formatCountdown(ms) {
      if (ms <= 0) return '00:00:00';
      const totalSec = Math.ceil(ms / 1000);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      return [hours, minutes, seconds].map((v) => String(v).padStart(2, '0')).join(':');
    }

    function formatRelativeTime(timestamp) {
      if (!timestamp) return 'Şimdi';
      const diffSeconds = Math.floor((Date.now() - timestamp) / 1000);
      if (diffSeconds < 60) return 'Şimdi';
      const diffMinutes = Math.floor(diffSeconds / 60);
      if (diffMinutes < 60) return `${diffMinutes}d`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}s`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays < 7) return `${diffDays}g`;
      return new Date(timestamp).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
    }

    function compressImageFile(file, maxWidth = 700, maxHeight = 700) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          if (file.type === 'image/gif') {
            resolve(event.target.result);
            return;
          }
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.84));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function readVideoFileAsDataUrl(file) {

        if (wheelSpinning || !user || !currentProfile) return;
        const lastSpin = currentProfile.lastWheelSpin || 0;
        const elapsed = Date.now() - lastSpin;
        if (elapsed < TWENTY_FOUR_HOURS_MS) {
          showToast(
            `Şans Çarkını günde sadece 1 defa çevirebilirsin! Kalan süre: ${formatCountdown(
              TWENTY_FOUR_HOURS_MS - elapsed
            )}`
          );
          return;
        }

        const spinTimestamp = Date.now();
        setNowTick(spinTimestamp);
        persistUserUpdate(user.uid, { lastWheelSpin: spinTimestamp });

        setWheelSpinning(true);
        setWheelResult(null);

        const totalWeight = WHEEL_SEGMENTS.reduce((sum, seg) => sum + (seg.weight || 1), 0);
        let roll = Math.random() * totalWeight;
        let chosenIndex = 0;
        for (let i = 0; i < WHEEL_SEGMENTS.length; i++) {
          roll -= WHEEL_SEGMENTS[i].weight || 1;
          if (roll <= 0) {
            chosenIndex = i;
            break;
          }
        }

        const chosenSegment = WHEEL_SEGMENTS[chosenIndex];
        const segmentAngle = 360 / WHEEL_SEGMENTS.length;
        const targetRotation =
          wheelRotation + 1440 + (360 - chosenIndex * segmentAngle - segmentAngle / 2);

        setWheelRotation(targetRotation);

        setTimeout(() => {
          setWheelSpinning(false);
          setWheelResult(chosenSegment);

          if (chosenSegment.type === 'points' && !isSiteManager) {
            persistUserUpdate(user.uid, {
              points: (currentProfile.points || 0) + chosenSegment.value,

                        <div className="flex items-center gap-2 pt-8">
                          <label className="px-3 py-1.5 rounded-full bg-[#202327] hover:bg-[#2f3336] text-white text-xs font-bold cursor-pointer flex items-center gap-1.5 transition">
                            <Camera className="w-3.5 h-3.5" />
                            <span>Galeriden PP Seç</span>
                            <input
                              type="file"
                              accept="image/*"
                              onChange={(e) => handleProfileImageUpload(e, 'avatarUrl')}
                              className="hidden"
                            />
                          </label>
                          {editForm.avatarUrl && (
                            <button
                              type="button"
                              onClick={() => setEditForm({ ...editForm, avatarUrl: '' })}
                              className="px-2.5 py-1.5 rounded-full bg-red-500/15 text-red-400 text-xs font-bold"
                            >
                              Kaldır
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1.5">Varsayılan Avatar Rengi</label>
                    <div className="flex gap-2">
                      {AVATAR_COLORS.map((col) => (
                        <button
                          key={col.id}
                          type="button"
                          onClick={() => setEditForm({ ...editForm, avatarColor: col.id })}
                          className={`w-8 h-8 rounded-full ${col.bg} transition transform ${
                            editForm.avatarColor === col.id
                              ? 'ring-2 ring-white scale-110'
                              : 'opacity-70 hover:opacity-100'
                          }`}
                        />
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Görünen Ad</label>
                    <input
                      type="text"
                      required
                      value={editForm.displayName}
                      onChange={(e) => setEditForm({ ...editForm, displayName: e.target.value })}
                      className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Kullanıcı Adı</label>
                    <input
                      type="text"
                      required
                      value={editForm.handle}
                      onChange={(e) => setEditForm({ ...editForm, handle: e.target.value })}
                      className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Biyografi</label>
                    <textarea
                      rows={2}
                      maxLength={160}
                      value={editForm.bio}
                      onChange={(e) => setEditForm({ ...editForm, bio: e.target.value })}
                      className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3 py-2 text-sm text-white resize-none outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-[#71767b] block mb-1">Konum</label>
                      <input
                        type="text"
                        value={editForm.location}
                        onChange={(e) => setEditForm({ ...editForm, location: e.target.value })}
                        className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3 py-2 text-sm text-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-[#71767b] block mb-1">Bağlantı / Web</label>
                      <input
                        type="text"
                        value={editForm.website}
                        onChange={(e) => setEditForm({ ...editForm, website: e.target.value })}
                        className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3 py-2 text-sm text-white outline-none"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsEditProfileOpen(false)}
                      className="px-4 py-2 rounded-full border border-[#2f3336] text-sm font-bold text-white hover:bg-[#181818]"
                    >
                      İptal
                    </button>
                    <button
                      type="submit"
                      className={`px-5 py-2 rounded-full ${theme.bg} ${theme.hoverBg} text-sm font-bold text-white`}
                    >
                      Kaydet
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>

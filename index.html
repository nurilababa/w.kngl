    function normalizeUserRoles(profileObj, fallbackRole = 'member') {
      const set = new Set();
      if (Array.isArray(profileObj?.roles)) {
        profileObj.roles.forEach((r) => {
          if (r && r !== 'member') set.add(r === 'admin' ? 'mod' : r);
        });
      }
      if (profileObj?.role && profileObj.role !== 'member') {
        set.add(profileObj.role === 'admin' ? 'mod' : profileObj.role);
      }
      if (fallbackRole && fallbackRole !== 'member') {
        set.add(fallbackRole === 'admin' ? 'mod' : fallbackRole);
      }
      return Array.from(set);
    }

    function formatCountdown(ms) {
      if (ms <= 0) return '00:00:00';
      const totalSec = Math.ceil(ms / 1000);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      return [hours, minutes, seconds].map((v) => String(v).padStart(2, '0')).join(':');
    }

    function formatRelativeTime(timestamp) {
      if (!timestamp) return 'Şimdi';
      const diffSeconds = Math.floor((Date.now() - timestamp) / 1000);
      if (diffSeconds < 60) return 'Şimdi';
      const diffMinutes = Math.floor(diffSeconds / 60);
      if (diffMinutes < 60) return `${diffMinutes}d`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}s`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays < 7) return `${diffDays}g`;
      return new Date(timestamp).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
    }

    function compressImageFile(file, maxWidth = 700, maxHeight = 700) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          if (file.type === 'image/gif') {
            resolve(event.target.result);
            return;
          }
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.84));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function readVideoFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

            if (hasRole(a, 'site_manager') && !hasRole(b, 'site_manager')) return -1;
            if (!hasRole(a, 'site_manager') && hasRole(b, 'site_manager')) return 1;
            const ptsDiff = (b.points || 0) - (a.points || 0);
            if (ptsDiff !== 0) return ptsDiff;
            return (b.level || 1) - (a.level || 1);
          });

        () => posts.find((p) => p.id === replyingToPostId) || null,

      // Kick tarzı @mention öneri listesi

        if (mentionQuery === null) return [];
        const q = mentionQuery.toLowerCase();
        return Object.values(allUsers)
          .filter((u) => u && u.uid && !u.isBanned)
          .filter(
            (u) =>
              (u.displayName || '').toLowerCase().includes(q) ||
              (u.handle || '').toLowerCase().replace(/^@/, '').includes(q)
          )
          .slice(0, 6);
      }, [mentionQuery, allUsers]);

      const handleChatInputChange = (e) => {
        const val = e.target.value;
        setChatInput(val);
        const cursorPos = e.target.selectionStart ?? val.length;
        const beforeCursor = val.slice(0, cursorPos);
        const match = beforeCursor.match(/(?:^|\s)@([a-zA-Z0-9_ğüşıöçĞÜŞİÖÇ]*)$/);
        if (match) {
          setMentionQuery(match[1]);
          setMentionSelectedIndex(0);
        } else {
          setMentionQuery(null);
        }
      };

      const insertChatMention = (targetMember) => {
        const cleanHandle = (targetMember.handle || `@${targetMember.displayName}`)
          .replace(/\s+/g, '')
          .replace(/^@?/, '@');
        const el = chatInputRef.current;
        const cursorPos = el?.selectionStart ?? chatInput.length;
        const beforeCursor = chatInput.slice(0, cursorPos);
        const afterCursor = chatInput.slice(cursorPos);
        const replacedBefore = beforeCursor.replace(
          /(?:^|\s)@([a-zA-Z0-9_ğüşıöçĞÜŞİÖÇ]*)$/,
          (full) => (full.startsWith(' ') ? ` ${cleanHandle} ` : `${cleanHandle} `)
        );
        const nextVal = replacedBefore + afterCursor;
        setChatInput(nextVal);
        setMentionQuery(null);
        setTimeout(() => {
          chatInputRef.current?.focus();
        }, 0);
      };

      const handleChatInputKeyDown = (e) => {
        if (mentionQuery !== null && mentionCandidates.length > 0) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setMentionSelectedIndex((prev) => (prev + 1) % mentionCandidates.length);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setMentionSelectedIndex(
              (prev) => (prev - 1 + mentionCandidates.length) % mentionCandidates.length
            );
          } else if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            insertChatMention(mentionCandidates[mentionSelectedIndex] || mentionCandidates[0]);
          } else if (e.key === 'Escape') {
            setMentionQuery(null);
          }
        }
      };

      const handleEmailAuth = async (e) => {

          } else {

          } else if (err?.code === 'auth/wrong-password') {
            setAuthError('E-posta veya şifre hatalı.');

            setAuthError('Bu e-posta ile kayıtlı hesap bulunamadı. Önce hesap oluştur.');

      const handleToggleFollow = (targetUid) => {
        if (!user || !currentProfile || targetUid === user.uid) return;
        const targetUser = allUsers[targetUid];
        if (!targetUser) return;

        const myFollowing = Array.isArray(currentProfile.following) ? currentProfile.following : [];
        const targetFollowers = Array.isArray(targetUser.followers) ? targetUser.followers : [];
        const isAlreadyFollowing = myFollowing.includes(targetUid);

        const updatedMyFollowing = isAlreadyFollowing
          ? myFollowing.filter((id) => id !== targetUid)
          : [...myFollowing, targetUid];
        const updatedTargetFollowers = isAlreadyFollowing
          ? targetFollowers.filter((id) => id !== user.uid)
          : [...targetFollowers, user.uid];

        persistUserUpdate(user.uid, { following: updatedMyFollowing });
        persistUserUpdate(targetUid, { followers: updatedTargetFollowers });

        showToast(
          isAlreadyFollowing

      const getWheelPeriodMs = (period) => {
        if (period === 'week') return 7 * TWENTY_FOUR_HOURS_MS;
        if (period === 'month') return THIRTY_DAYS_MS;
        return TWENTY_FOUR_HOURS_MS;
      };

      const getCustomWheelRemainingSpins = (wheelItem) => {
        if (!currentProfile) return 0;
        const historyMap = currentProfile.customWheelHistory || {};
        const timestamps = Array.isArray(historyMap[wheelItem.id]) ? historyMap[wheelItem.id] : [];
        const periodMs = getWheelPeriodMs(wheelItem.period);
        const recent = timestamps.filter((ts) => nowTick - ts < periodMs);
        return Math.max(0, (wheelItem.maxSpins || 1) - recent.length);
      };

      const handleSpinCustomWheel = (wheelItem) => {
        if (activeWheelSpinId || !user || !currentProfile) return;
        const remainingSpins = getCustomWheelRemainingSpins(wheelItem);
        if (remainingSpins <= 0) {
          const periodLabel =
            wheelItem.period === 'week'
              ? 'haftalık'
              : wheelItem.period === 'month'
              ? 'aylık'
              : 'günlük';
          showToast(`Bu çark için ${periodLabel} çevirme hakkın doldu!`);
          return;
        }

        const spinTs = Date.now();
        const historyMap = { ...(currentProfile.customWheelHistory || {}) };
        const periodMs = getWheelPeriodMs(wheelItem.period);
        const prevList = Array.isArray(historyMap[wheelItem.id]) ? historyMap[wheelItem.id] : [];
        historyMap[wheelItem.id] = [...prevList.filter((ts) => spinTs - ts < periodMs), spinTs];

        persistUserUpdate(user.uid, { customWheelHistory: historyMap });

        setActiveWheelSpinId(wheelItem.id);
        setCustomWheelResult(null);

        const segs = wheelItem.segments || [];
        const totalWeight = segs.reduce((sum, s) => sum + (s.weight || 1), 0);
        let roll = Math.random() * totalWeight;
        let chosenIndex = 0;
        for (let i = 0; i < segs.length; i++) {
          roll -= segs[i].weight || 1;
          if (roll <= 0) {
            chosenIndex = i;
            break;
          }
        }

        const chosen = segs[chosenIndex];
        const segAngle = 360 / segs.length;
        const nextRot =
          customWheelRotation + 1440 + (360 - chosenIndex * segAngle - segAngle / 2);
        setCustomWheelRotation(nextRot);

        setTimeout(() => {
          setActiveWheelSpinId(null);
          setCustomWheelResult({ wheelId: wheelItem.id, segment: chosen });

          if (chosen.type === 'points' && !isSiteManager) {
            persistUserUpdate(user.uid, {
              points: (currentProfile.points || 0) + (chosen.pointsValue || 0),
              customWheelHistory: historyMap
            });
          } else if (chosen.type === 'level' && !isSiteManager) {
            persistUserUpdate(user.uid, {
              level: (currentProfile.level || 1) + (chosen.levelValue || 1),
              customWheelHistory: historyMap

            persistUserUpdate(user.uid, {
              customBadges: [
                ...existingBadges,
                {
                  id: `cb_${Date.now()}`,
                  label: chosen.label,
                  mediaUrl: chosen.mediaUrl || ''
                }
              ],
              customWheelHistory: historyMap
            });
          }

          showToast(`Çark Ödülü Kazandın: ${chosen.label}!`);
        }, 3200);

        e.preventDefault();

        // Kullanıcının son attığı gönderileri, yanıtları ve canlı sohbet mesajlarını ekle
        const recentPosts = posts

        const recentChats = chatMessages

          .map((m) => ({

            createdAt: m.createdAt || Date.now()

        const recentReplies = [];

              recentReplies.push({ text: r.text, createdAt: r.createdAt || Date.now() });

        recentReplies.sort((a, b) => b.createdAt - a.createdAt);

        const newAppeal = {
          id: `appeal_${Date.now()}_${Math.random().toString(36).substring(2, 5)}`,
          userUid: user.uid,
          userName: currentProfile.displayName,
          userHandle: currentProfile.handle,
          userEmail: currentProfile.email || '',
          banReason: currentProfile.banReason || 'Belirtilmemiş',
          appealMessage: appealText.trim(),
          recentPosts,
          recentChats,
          recentReplies: recentReplies.slice(0, 5),
          status: 'pending',
          createdAt: Date.now()

        setBanAppeals((prev) => {
          const updated = [newAppeal, ...prev];
          writeLocalStore(STORAGE_KEYS.APPEALS, updated);
          return updated;

        if (db && auth?.currentUser) {
          addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'appeals'), newAppeal).catch(

        if (!isSiteManager) {

        const targetCurrent = allUsers[giftTargetUser.uid] || giftTargetUser;
        if (!hasRole(targetCurrent, 'site_manager')) {

        sendUserNotification(

      const handleSpinWheel = () => {
        if (wheelSpinning || !user || !currentProfile) return;
        const lastSpin = currentProfile.lastWheelSpin || 0;
        const elapsed = Date.now() - lastSpin;
        if (elapsed < TWENTY_FOUR_HOURS_MS) {
          showToast(
            `Şans Çarkını günde sadece 1 defa çevirebilirsin! Kalan süre: ${formatCountdown(
              TWENTY_FOUR_HOURS_MS - elapsed
            )}`
          );
          return;
        }

        const spinTimestamp = Date.now();
        setNowTick(spinTimestamp);
        persistUserUpdate(user.uid, { lastWheelSpin: spinTimestamp });

        setWheelSpinning(true);
        setWheelResult(null);

        const totalWeight = WHEEL_SEGMENTS.reduce((sum, seg) => sum + (seg.weight || 1), 0);
        let roll = Math.random() * totalWeight;
        let chosenIndex = 0;
        for (let i = 0; i < WHEEL_SEGMENTS.length; i++) {
          roll -= WHEEL_SEGMENTS[i].weight || 1;
          if (roll <= 0) {
            chosenIndex = i;
            break;
          }
        }

        const chosenSegment = WHEEL_SEGMENTS[chosenIndex];
        const segmentAngle = 360 / WHEEL_SEGMENTS.length;
        const targetRotation =
          wheelRotation + 1440 + (360 - chosenIndex * segmentAngle - segmentAngle / 2);

        setWheelRotation(targetRotation);

        setTimeout(() => {
          setWheelSpinning(false);
          setWheelResult(chosenSegment);

          if (chosenSegment.type === 'points' && !isSiteManager) {
            persistUserUpdate(user.uid, {
              points: (currentProfile.points || 0) + chosenSegment.value,
              lastWheelSpin: spinTimestamp

                          <span
                            key={s.id}
                            className="px-2.5 py-1 rounded-full bg-black border border-[#2f3336] text-xs text-white flex items-center gap-1.5"
                          >
                            {s.mediaUrl && (
                              <img src={s.mediaUrl} alt={s.label} className="w-4 h-4 rounded-sm" />
                            )}
                            <span>{s.label}</span>
                            <button
                              type="button"
                              onClick={() =>
                                setWheelSegmentsDraft((prev) => prev.filter((x) => x.id !== s.id))
                              }
                              className="text-red-400 hover:text-red-300 font-bold"
                            >
                              ×
                            </button>
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowCreateWheelModal(false)}
                      className="px-4 py-2 rounded-full text-xs text-[#71767b] hover:text-white"
                    >
                      İptal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs"
                    >
                      Çarkı Kaydet ve Yayınla
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {followListModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#16181c] border border-[#2f3336] rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-[#2f3336]">
                  <span className="font-extrabold text-sm text-white">{followListModal.title}</span>
                  <button
                    onClick={() => setFollowListModal(null)}
                    className="p-1 rounded-full hover:bg-[#2f3336] text-[#71767b]"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="max-h-72 overflow-y-auto divide-y divide-[#2f3336]/60">
                  {followListModal.uids.length === 0 ? (
                    <p className="py-8 text-center text-xs text-[#71767b]">Henüz kimse yok.</p>
                  ) : (
                    followListModal.uids.map((uidItem) => {
                      const uObj = allUsers[uidItem];
                      if (!uObj) return null;
                      return (
                        <div
                          key={uidItem}
                          onClick={() => {
                            setFollowListModal(null);
                            handleOpenUserProfile(uidItem);
                          }}
                          className="py-2.5 flex items-center gap-2.5 cursor-pointer hover:bg-[#202327] px-2 rounded-xl"
                        >
                          {renderAvatar(uObj, uObj.displayName, uObj.avatarColor, 'w-8 h-8 text-xs')}
                          <div className="min-w-0">
                            <p
                              className={`text-xs font-bold truncate ${getNickColorClass(
                                uObj.nickColor,
                                hasRole(uObj, 'vip')
                              )}`}
                            >
                              {uObj.displayName}
                            </p>
                            <p className="text-[11px] text-[#71767b] truncate">{uObj.handle}</p>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {activeReplyingPost && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#16181c] border border-[#2f3336] rounded-2xl w-full max-w-lg p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-[#2f3336]">
                  <span className="font-bold text-sm text-white">Yanıt Gönder</span>
                  <button
                    onClick={() => {
                      setReplyingToPostId(null);
                      setReplyText('');
                    }}
                    className="p-1.5 rounded-full hover:bg-[#2f3336] text-[#71767b] hover:text-white"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="py-3 text-sm text-[#71767b] border-b border-[#2f3336]">
                  <span className="text-white font-semibold">{activeReplyingPost.authorName}</span>{' '}
                  adlı kişiye yanıt veriliyor:
                  <p className="text-[#e7e9ea] mt-1 line-clamp-2">{activeReplyingPost.content}</p>
                </div>

                <form onSubmit={handleSendReply} className="mt-3 space-y-3">
                  <textarea
                    rows={3}
                    autoFocus
                    maxLength={280}
                    value={replyText}
                    onChange={(e) => setReplyText(e.target.value)}
                    placeholder="Yanıtını yaz..."
                    className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl p-3 text-sm text-white placeholder-[#71767b] outline-none resize-none"
                  />
                  <div className="flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        setReplyingToPostId(null);
                        setReplyText('');
                      }}
                      className="px-4 py-1.5 rounded-full text-sm text-[#71767b] hover:text-white"
                    >
                      İptal
                    </button>
                    <button
                      type="submit"
                      disabled={sendingReply || !replyText.trim()}
                      className={`px-5 py-1.5 rounded-full ${theme.bg} ${theme.hoverBg} disabled:opacity-40 text-white font-bold text-sm`}
                    >
                      {sendingReply ? 'Gönderiliyor...' : 'Yanıtla'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isEditProfileOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#16181c] border border-[#2f3336] rounded-2xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-[#2f3336]">
                  <span className="font-bold text-lg text-white">Profili Düzenle</span>
                  <button
                    onClick={() => setIsEditProfileOpen(false)}
                    className="p-1.5 rounded-full hover:bg-[#2f3336] text-[#71767b] hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveProfile} className="mt-4 space-y-3.5">
                  <div>
                    <label className="text-xs text-[#71767b] block mb-1.5">
                      Arka Plan Kapak Fotoğrafı (Banner)
                    </label>
                    <div className="relative h-24 rounded-xl overflow-hidden border border-[#2f3336] bg-black flex items-center justify-center">
                      {editForm.bannerUrl ? (
                        <img
                          src={editForm.bannerUrl}
                          alt="Banner Önizleme"
                          className="w-full h-full object-cover"
                        />
                      ) : (
                        <span className="text-xs text-[#71767b]">Kapak fotoğrafı seçilmedi</span>
                      )}
                      <label className="absolute bottom-2 right-2 px-3 py-1 rounded-full bg-black/80 border border-[#2f3336] hover:bg-[#202327] text-xs font-bold text-white cursor-pointer flex items-center gap-1.5 transition">
                        <Camera className="w-3.5 h-3.5 text-[#1d9bf0]" />
                        <span>Kapak Fotoğrafı Seç</span>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => handleProfileImageUpload(e, 'bannerUrl')}
                          className="hidden"
                        />
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1.5">Profil Fotoğrafı</label>
                    <div className="flex items-center gap-3">
                      {editForm.avatarUrl ? (
                        <img
                          src={editForm.avatarUrl}
                          alt="Profil Önizleme"
                          className="w-14 h-14 rounded-full object-cover border border-[#2f3336]"
                        />
                      ) : (
                        <div
                          className={`w-14 h-14 rounded-full ${getAvatarBgClass(
                            editForm.avatarColor
                          )} flex items-center justify-center font-bold text-white text-base`}
                        >
                          {getInitials(editForm.displayName)}
                        </div>
                      )}
                      <label className="px-3.5 py-2 rounded-full bg-black border border-[#2f3336] hover:bg-[#202327] text-xs font-bold text-white cursor-pointer flex items-center gap-1.5 transition">
                        <Camera className="w-3.5 h-3.5 text-[#1d9bf0]" />
                        <span>Cihazdan Fotoğraf Seç</span>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => handleProfileImageUpload(e, 'avatarUrl')}
                          className="hidden"
                        />
                      </label>
                      {editForm.avatarUrl && (
                        <button
                          type="button"
                          onClick={() => setEditForm((prev) => ({ ...prev, avatarUrl: '' }))}
                          className="text-xs text-red-400 hover:underline"
                        >
                          Kaldır
                        </button>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Görünen Ad</label>
                    <input
                      type="text"
                      maxLength={40}
                      required
                      value={editForm.displayName}
                      onChange={(e) => setEditForm({ ...editForm, displayName: e.target.value })}
                      className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1.5">
                      Nick Rengini Seç
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      {NICK_COLORS.map((nc) => (
                        <button
                          key={nc.id}
                          type="button"
                          onClick={() => setEditForm({ ...editForm, nickColor: nc.id })}
                          className={`px-3 py-2 rounded-xl border text-xs font-extrabold flex items-center gap-2 transition ${
                            editForm.nickColor === nc.id
                              ? 'bg-[#202327] border-white'
                              : 'bg-black border-[#2f3336] hover:border-[#71767b]'
                          }`}
                        >
                          <span
                            style={{ backgroundColor: nc.swatch }}
                            className="w-3.5 h-3.5 rounded-full shrink-0"
                          />
                          <span className={nc.className}>{nc.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Kullanıcı Adı</label>
                    <input
                      type="text"
                      maxLength={25}
                      required
                      value={editForm.handle}
                      onChange={(e) => setEditForm({ ...editForm, handle: e.target.value })}
                      className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Biyografi</label>
                    <textarea
                      rows={2}
                      maxLength={160}
                      value={editForm.bio}
                      onChange={(e) => setEditForm({ ...editForm, bio: e.target.value })}
                      className="w-full bg-black border border-[#2f3336] focus:border-[#1d9bf0] rounded-xl px-3.5 py-2 text-sm text-white outline-none resize-none"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsEditProfileOpen(false)}
                      className="px-4 py-2 rounded-full text-sm text-[#71767b] hover:text-white"
                    >
                      İptal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-full bg-white text-black font-bold text-sm hover:bg-gray-200 transition"
                    >
                      Kaydet
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* KALICI BAN SEBEBİ MODALI */}
          {banModalTarget && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#16181c] border border-red-500/40 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-[#2f3336]">
                  <div className="flex items-center gap-2 font-extrabold text-base text-red-400">
                    <UserX className="w-5 h-5" />
                    <span>Kalıcı Banla: {banModalTarget.displayName}</span>
                  </div>
                  <button
                    onClick={() => setBanModalTarget(null)}
                    className="p-1.5 rounded-full hover:bg-[#2f3336] text-[#71767b]"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleConfirmBanWithReason} className="space-y-3">
                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Ban Sebebi</label>
                    <textarea
                      rows={3}
                      required
                      value={banReasonInput}
                      onChange={(e) => setBanReasonInput(e.target.value)}
                      placeholder="Ban sebebini yaz..."
                      className="w-full bg-black border border-[#2f3336] focus:border-red-500 rounded-xl p-3 text-sm text-white outline-none resize-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setBanModalTarget(null)}
                      className="px-4 py-2 rounded-full text-xs text-[#71767b] hover:text-white"
                    >
                      İptal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-full bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs"
                    >
                      Kalıcı Banla
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ÖZEL UZAKLAŞTIRMA SÜRESİ MODALI */}
          {customTimeoutModalTarget && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#16181c] border border-amber-500/40 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-[#2f3336]">
                  <div className="flex items-center gap-2 font-extrabold text-base text-amber-300">
                    <Clock className="w-5 h-5" />
                    <span>Özel Uzaklaştırma: {customTimeoutModalTarget.displayName}</span>
                  </div>
                  <button
                    onClick={() => setCustomTimeoutModalTarget(null)}
                    className="p-1.5 rounded-full hover:bg-[#2f3336] text-[#71767b]"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleConfirmCustomTimeout} className="space-y-3">
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="number"
                      min="1"
                      required
                      value={customTimeoutAmount}
                      onChange={(e) => setCustomTimeoutAmount(e.target.value)}
                      className="w-full bg-black border border-[#2f3336] rounded-xl px-3 py-2 text-sm text-white outline-none"
                    />
                    <select
                      value={customTimeoutUnit}
                      onChange={(e) => setCustomTimeoutUnit(e.target.value)}
                      className="w-full bg-black border border-[#2f3336] rounded-xl px-3 py-2 text-sm text-white outline-none"
                    >
                      <option value="minutes">Dakika</option>
                      <option value="days">Gün</option>
                      <option value="weeks">Hafta</option>
                    </select>
                  </div>
                  <input
                    type="text"
                    value={customTimeoutReason}
                    onChange={(e) => setCustomTimeoutReason(e.target.value)}
                    placeholder="Uzaklaştırma sebebi (isteğe bağlı)..."
                    className="w-full bg-black border border-[#2f3336] rounded-xl px-3 py-2 text-sm text-white outline-none"
                  />
                  <div className="flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setCustomTimeoutModalTarget(null)}
                      className="px-4 py-2 rounded-full text-xs text-[#71767b] hover:text-white"
                    >
                      İptal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs"
                    >
                      Uzaklaştır
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PUAN HEDİYE ETME MODALI */}
          {giftTargetUser && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#16181c] border border-amber-500/40 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-[#2f3336]">
                  <div className="flex items-center gap-2 font-extrabold text-base text-amber-300">
                    <Gift className="w-5 h-5" />
                    <span>{giftTargetUser.displayName} · Puan Hediye Et</span>
                  </div>
                  <button
                    onClick={() => setGiftTargetUser(null)}
                    className="p-1.5 rounded-full hover:bg-[#2f3336] text-[#71767b]"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleSendPointGift} className="space-y-3">
                  <div className="grid grid-cols-4 gap-1.5">
                    {[25, 50, 100, 250].map((amt) => (
                      <button
                        key={amt}
                        type="button"
                        onClick={() => setGiftAmount(amt)}
                        className={`py-1.5 rounded-xl text-xs font-extrabold border ${
                          Number(giftAmount) === amt
                            ? 'bg-amber-500/20 border-amber-400 text-amber-300'
                            : 'bg-black border-[#2f3336] text-[#71767b]'
                        }`}
                      >
                        +{amt}P
                      </button>
                    ))}
                  </div>
                  <input
                    type="number"
                    min="1"
                    required
                    value={giftAmount}
                    onChange={(e) => setGiftAmount(e.target.value)}
                    className="w-full bg-black border border-[#2f3336] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                  />
                  <div className="flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setGiftTargetUser(null)}
                      className="px-4 py-2 rounded-full text-xs text-[#71767b] hover:text-white"
                    >
                      İptal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs"
                    >
                      Hediye Gönder
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

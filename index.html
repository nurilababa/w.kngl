    function normalizeUserRoles(profileObj, fallbackRole = 'member') {
      const set = new Set();
      if (Array.isArray(profileObj?.roles)) {
        profileObj.roles.forEach((r) => {
          if (r && r !== 'member') set.add(r === 'admin' ? 'mod' : r);
        });
      }
      if (profileObj?.role && profileObj.role !== 'member') {
        set.add(profileObj.role === 'admin' ? 'mod' : profileObj.role);
      }
      if (fallbackRole && fallbackRole !== 'member') {
        set.add(fallbackRole === 'admin' ? 'mod' : fallbackRole);
      }
      return Array.from(set);
    }

    function hasRole(profileObj, roleKey) {
      const target = roleKey === 'admin' ? 'mod' : roleKey;
      return normalizeUserRoles(profileObj).includes(target);
    }

    function formatCountdown(ms) {
      if (ms <= 0) return '00:00:00';
      const totalSec = Math.ceil(ms / 1000);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      return [hours, minutes, seconds].map((v) => String(v).padStart(2, '0')).join(':');
    }

    function isMessagePureEmotes(text) {
      const trimmed = text.trim();
      if (!trimmed) return false;
      let remaining = trimmed;
      KICK_STYLE_EMOTES.forEach((ke) => {
        remaining = remaining.split(ke.code).join('');
      });
      SPECIAL_EMOJIS.forEach((sp) => {
        remaining = remaining.split(sp.icon).join('');
      });
      NORMAL_EMOJIS.forEach((em) => {
        remaining = remaining.split(em).join('');
      });
      remaining = remaining.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}\uFE0F\u200D\s]/gu, '');
      return remaining.length === 0;
    }

    function formatRelativeTime(timestamp) {
      if (!timestamp) return 'Şimdi';
      const diffSeconds = Math.floor((Date.now() - timestamp) / 1000);
      if (diffSeconds < 60) return 'Şimdi';
      const diffMinutes = Math.floor(diffSeconds / 60);
      if (diffMinutes < 60) return `${diffMinutes}d`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}s`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays < 7) return `${diffDays}g`;
      return new Date(timestamp).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
    }

    function formatCompactNumber(num) {

      if (n >= 1000000) {

      }
      if (n >= 1000) {

      return String(n);

    function compressImageFile(file, maxWidth = 700, maxHeight = 700) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          if (file.type === 'image/gif') {
            resolve(event.target.result);
            return;
          }
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.84));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function readVideoFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        countedViewsRef.current.add(key);

        setPosts((prev) => {

      useEffect(() => {
        if (!user || typeof IntersectionObserver === 'undefined') return;
        if (!['home', 'bookmarks', 'profile', 'liked'].includes(activeNav)) return;
        const timers = new Map();
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              const pid = entry.target.getAttribute('data-post-id');
              if (!pid) return;
              const seen =
                entry.isIntersecting &&
                (entry.intersectionRatio >= 0.6 || entry.intersectionRect.height >= window.innerHeight * 0.5);
              if (seen) {
                if (!timers.has(pid)) {
                  timers.set(
                    pid,
                    setTimeout(() => {
                      timers.delete(pid);
                      registerPostView(pid);
                    }, 1000)
                  );
                }
              } else if (timers.has(pid)) {
                clearTimeout(timers.get(pid));
                timers.delete(pid);
              }
            });
          },
          { threshold: [0, 0.3, 0.6, 1] }
        );
        document.querySelectorAll('article[data-post-id]').forEach((el) => observer.observe(el));
        return () => {
          timers.forEach((t) => clearTimeout(t));
          observer.disconnect();

                lastWheelSpin: 0,
                subscriptionExpiresAt: 0,
                autoRenewSub: true,
                isBanned: false,
                banReason: '',
                timeoutUntil: 0,
                timeoutReason: '',
                joinedAt: Date.now(),
                lastActiveAt: Date.now()
              };
              setAllUsers((prev) => {
                const updated = { ...prev, [uid]: fallbackProfile };
                writeLocalStore(STORAGE_KEYS.USERS, updated);
                return updated;
              });
            } else if (assignSiteManager && !hasRole(matchedLocal, 'site_manager')) {
              const nextRoles = Array.from(
                new Set([...normalizeUserRoles(matchedLocal), 'site_manager'])
              );
              persistUserUpdate(uid, {
                role: 'site_manager',
                roles: nextRoles,
                lastActiveAt: Date.now()
              });
            } else {
              persistUserUpdate(uid, { lastActiveAt: Date.now() });
            }

            showToast(
              assignSiteManager
                ? 'Site Yöneticisi olarak giriş yapıldı!'
                : `Tekrar hoş geldin, ${displayNameClean}!`
            );
          }
        } catch (err) {
          if (err?.code === 'auth/weak-password') {
            setAuthError('Şifre en az 6 karakter olmalıdır.');
          } else if (err?.code === 'auth/email-already-in-use') {
            setAuthError(
              'Bu e-posta adresiyle zaten bir hesap oluşturulmuş! Lütfen "Giriş Yap" bölümünden şifrenle giriş yap.'
            );
          } else if (err?.code === 'auth/handle-taken') {
            setAuthError('Bu @kullaniciadi başka bir üye tarafından alınmış. Farklı bir kullanıcı adı seç.');
          } else if (err?.code === 'auth/wrong-password') {
            setAuthError('E-posta veya şifre hatalı.');
          } else if (err?.code === 'auth/user-not-found') {
            setAuthError('Bu e-posta ile kayıtlı hesap bulunamadı. Önce hesap oluştur.');
          } else {
            setAuthError('Giriş işlemi tamamlanamadı. Bilgilerini kontrol et.');
          }
        } finally {
          setAuthBusy(false);
        }
      };

      const completeGoogleAccountLogin = (emailRaw, nameRaw, photoUrl = '') => {
        const emailLower = emailRaw.trim().toLowerCase();
        const displayNameClean = nameRaw.trim() || emailLower.split('@')[0];
        const assignSiteManager = FOUNDER_EMAILS.includes(emailLower);

        const existingUser = Object.values(allUsers).find(
          (u) => (u.email || '').toLowerCase() === emailLower
        );

        const uid =
          existingUser?.uid ||
          `google_${emailLower.replace(/[^a-z0-9]/g, '_')}_${Math.random().toString(36).substring(2, 5)}`;

        const activeUserObj = {
          uid,
          email: emailLower,
          displayName: existingUser?.displayName || displayNameClean,
          photoURL: existingUser?.avatarUrl || photoUrl,
          isAnonymous: false
        };

        setUser(activeUserObj);
        writeLocalStore(STORAGE_KEYS.ACTIVE_USER, activeUserObj);

        if (!existingUser) {
          const gHandle = `@${displayNameClean.toLowerCase().replace(/[^a-z0-9_]/g, '') || 'uye'}`;
          const profileData = {
            uid,
            email: emailLower,
            displayName: displayNameClean,
            handle: gHandle,
            bio: assignSiteManager ? 'w.kngl Site Yöneticisi & Kurucu' : 'Google ile bağlandı',
            location: 'Türkiye',
            website: '',
            avatarColor: assignSiteManager ? 'amber' : 'blue',
            nickColor: 'white',
            avatarUrl: photoUrl || '',
            bannerUrl: '',
            avatarZoom: 1,
            avatarPosX: 50,
            avatarPosY: 50,
            bannerZoom: 1,
            bannerPosX: 50,
            bannerPosY: 50,
            role: assignSiteManager ? 'site_manager' : 'member',
            roles: assignSiteManager ? ['site_manager'] : [],
            points: 100,
            level: 1,
            followers: [],
            following: [],
            unlockedEmojis: [],
            customBadges: [],
            customWheelHistory: {},
            notificationsEnabled: true,
            lastWheelSpin: 0,
            subscriptionExpiresAt: 0,
            autoRenewSub: true,
            isBanned: false,
            banReason: '',
            timeoutUntil: 0,
            timeoutReason: '',
            joinedAt: Date.now(),
            lastActiveAt: Date.now()
          };
          setAllUsers((prev) => {
            const updated = { ...prev, [uid]: profileData };
            writeLocalStore(STORAGE_KEYS.USERS, updated);
            return updated;
          });
          if (db && auth?.currentUser) {
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uid), profileData, {
              merge: true
            }).catch(() => {});
          }
        } else if (assignSiteManager && !hasRole(existingUser, 'site_manager')) {
          const nextRoles = Array.from(
            new Set([...normalizeUserRoles(existingUser), 'site_manager'])
          );
          persistUserUpdate(uid, {
            role: 'site_manager',
            roles: nextRoles,
            lastActiveAt: Date.now()
          });
        } else {
          persistUserUpdate(uid, { lastActiveAt: Date.now() });
        }

        setShowGoogleSimModal(false);
        showToast(
          assignSiteManager
            ? 'Google ile Site Yöneticisi girişi yapıldı! (Sınırsız Puan & Sınırsız Seviye)'
            : `${displayNameClean} Google hesabıyla giriş yapıldı!`
        );
      };

      const getAvatarBgClass = (colorId) => {
        const found = AVATAR_COLORS.find((c) => c.id === colorId);
        return found ? found.bg : 'bg-[#1d9bf0]';
      };

      const renderAvatar = (profileObj, name, colorId, sizeClass = 'w-10 h-10 text-sm') => {
        const avatarUrl = profileObj?.avatarUrl;
        if (avatarUrl) {
          const zoom = Number(profileObj?.avatarZoom) || 1;
          const posX = profileObj?.avatarPosX ?? 50;
          const posY = profileObj?.avatarPosY ?? 50;
          return (
            <div className={`${sizeClass} rounded-full overflow-hidden shrink-0 border border-[#2f3336] bg-black`}>
              <img
                src={avatarUrl}
                alt={name || 'Avatar'}
                style={{
                  objectPosition: `${posX}% ${posY}%`,
                  transform: `scale(${zoom})`,
                  transformOrigin: `${posX}% ${posY}%`
                }}
                className="w-full h-full object-cover"
              />
            </div>
          );
        }
        return (
          <div
            className={`${sizeClass} rounded-full ${getAvatarBgClass(
              colorId
            )} flex items-center justify-center font-extrabold text-white shrink-0 select-none`}
          >
            {getInitials(name)}
          </div>
        );
      };

      const renderUserBadges = (
        profileObj,
        fallbackRole = 'member',
        fallbackLevel = null,
        fallbackSub = false
      ) => {
        const roles = normalizeUserRoles(profileObj, fallbackRole);
        const lvl = profileObj?.level || fallbackLevel;
        const subActive =
          fallbackSub ||
          hasRole(profileObj, 'site_manager') ||
          (profileObj?.subscriptionExpiresAt || 0) > nowTick;

        return (
          <span className="inline-flex items-center gap-1 flex-wrap">
            {roles.map((rKey) => {
              const meta = ROLE_META[rKey];
              if (!meta) return null;
              const IconComp = meta.icon;
              return (
                <span
                  key={rKey}
                  className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full border text-[10px] font-extrabold ${meta.badgeClass}`}
                >
                  <IconComp className={`w-3 h-3 ${meta.iconClass}`} />
                  <span>{meta.label}</span>
                </span>
              );
            })}
            {subActive && !hasRole(profileObj, 'site_manager') && (
              <span className="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[10px] font-extrabold">
                <Gem className="w-2.5 h-2.5" />
                <span>Abone</span>
              </span>
            )}
            {lvl && (
              <span className="px-1.5 py-0.5 rounded-full bg-[#202327] text-[#e7e9ea] text-[10px] font-bold">
                {hasRole(profileObj, 'site_manager') ? 'Lv.∞' : `Lv.${lvl}`}
              </span>
            )}
          </span>
        );
      };

      const renderFormattedText = (text) => {
        if (!text) return null;
        const parts = text.split(
          /(:[a-zA-Z0-9_ğüşıöçĞÜŞİÖÇ]+:|#[a-zA-Z0-9_ğüşıöçĞÜŞİÖÇ]+|@[a-zA-Z0-9_ğüşıöçĞÜŞİÖÇ]+)/g
        );
        return parts.map((part, idx) => {
          if (part.startsWith(':') && part.endsWith(':') && part.length > 2) {
            const matchedEmote = allEmotesList.find(
              (e) => e.code.toLowerCase() === part.toLowerCase()
            );
            if (matchedEmote) {
              return (
                <img
                  key={idx}
                  src={matchedEmote.imageUrl || matchedEmote.svg}
                  alt={matchedEmote.label}
                  title={`${matchedEmote.label} (${matchedEmote.code})`}
                  className="inline-block w-6 h-6 align-middle mx-0.5 rounded object-cover select-none"
                />
              );
            }
          }
          if (part.startsWith('#')) {
            return (
              <span
                key={idx}
                onClick={(e) => {
                  e.stopPropagation();
                  setSelectedTag(part);
                  setActiveNav('home');
                }}
                className={`${theme.text} hover:underline cursor-pointer font-medium`}
              >
                {part}
              </span>
            );
          }
          if (part.startsWith('@')) {
            const foundUser = Object.values(allUsers).find(
              (u) => (u.handle || '').toLowerCase() === part.toLowerCase()
            );
            const isMentioningMe =
              currentProfile?.handle &&
              part.toLowerCase() === currentProfile.handle.toLowerCase();
            return (
              <span
                key={idx}
                onClick={(e) => {
                  e.stopPropagation();
                  if (foundUser) handleOpenUserProfile(foundUser.uid);
                }}
                className={`${
                  isMentioningMe
                    ? 'bg-emerald-500/30 text-emerald-200 px-1.5 py-0.5 rounded-md font-extrabold'
                    : 'text-emerald-400 font-semibold'
                } hover:underline cursor-pointer`}
              >
                {part}
              </span>
            );
          }
          return <React.Fragment key={idx}>{part}</React.Fragment>;
        });
      };

      const handleSelectKickEmote = (emote, setter, maxLen = 280) => {
        if (!user || !currentProfile) return;
        const unlocked =
          !emote.isSpecial ||
          isSiteManager ||
          isYetkili ||
          isMod ||
          isVip ||
          (currentProfile.unlockedEmojis || []).includes(emote.id);

        if (!unlocked) {
          const currentPts = currentProfile.points || 0;
          if (currentPts < emote.cost) {
            showToast(`Bu özel emote için ${emote.cost} Puan gerekiyor! (Mevcut: ${currentPts}P)`);
            return;
          }
          const nextUnlocked = [...(currentProfile.unlockedEmojis || []), emote.id];
          persistUserUpdate(user.uid, {
            points: currentPts - emote.cost,
            unlockedEmojis: nextUnlocked
          });
          showToast(`${emote.label} (${emote.cost} Puan) kalıcı olarak açıldı!`);
        }

        setter((prev) => {
          const token = `${prev && !prev.endsWith(' ') ? ' ' : ''}${emote.code} `;
          if (prev.length + token.length > maxLen) return prev;
          return prev + token;
        });
      };

      const renderEmotePickerGrid = (setter, maxLen = 280) => {
        const freeEmotes = allEmotesList.filter((e) => !e.isSpecial);
        const specialEmotes = allEmotesList.filter((e) => e.isSpecial);

        return (
          <div className="p-2.5 rounded-2xl bg-[#16181c] border border-[#2f3336] space-y-2.5 max-h-64 overflow-y-auto">
            <div className="flex items-center justify-between gap-2">
              <p className="text-[10px] font-extrabold uppercase tracking-wider text-[#71767b]">
                Ücretsiz Topluluk Emote&apos;leri (Herkese Açık)
              </p>
              {canManageEventsAndWheels && (
                <button
                  type="button"
                  onClick={() => setShowCreateEmoteModal(true)}
                  className="px-2.5 py-0.5 rounded-full bg-[#1d9bf0]/20 border border-[#1d9bf0]/40 text-[#1d9bf0] hover:bg-[#1d9bf0] hover:text-white text-[10px] font-extrabold transition"
                >
                  + Fotoğraftan Emote Ekle
                </button>
              )}
            </div>
            <div className="flex flex-wrap gap-1.5">
              {freeEmotes.map((em) => (
                <button
                  key={em.id}
                  type="button"
                  onClick={() => handleSelectKickEmote(em, setter, maxLen)}
                  title={`${em.label} (${em.code})`}
                  className="p-1.5 rounded-xl bg-black/70 border border-[#2f3336] hover:border-[#1d9bf0] transition flex items-center gap-1"
                >
                  <img
                    src={em.imageUrl || em.svg}
                    alt={em.label}
                    className="w-6 h-6 object-cover rounded"
                  />
                </button>
              ))}
              {NORMAL_EMOJIS.map((em) => (
                <button
                  key={em}
                  type="button"
                  onClick={() =>
                    setter((prev) => (prev.length + em.length <= maxLen ? prev + em : prev))
                  }
                  className="px-2 py-1 rounded-lg hover:bg-[#202327] text-base"
                >
                  {em}
                </button>
              ))}
            </div>

            <div className="pt-2 border-t border-[#2f3336]">
              <p className="text-[10px] font-extrabold uppercase tracking-wider text-amber-300 mb-1.5">
                Özel Puanlı Emote&apos;ler (Puan ile Kalıcı Açılır)
              </p>
              <div className="flex flex-wrap gap-1.5">
                {specialEmotes.map((sp) => {
                  const unlocked =
                    isSiteManager ||
                    isYetkili ||
                    isMod ||
                    isVip ||
                    (currentProfile?.unlockedEmojis || []).includes(sp.id);
                  return (
                    <button
                      key={sp.id}
                      type="button"
                      onClick={() => handleSelectKickEmote(sp, setter, maxLen)}
                      title={`${sp.label} (${unlocked ? 'Açık' : `${sp.cost} Puan`})`}
                      className={`px-2 py-1 rounded-xl border text-xs flex items-center gap-1.5 transition ${
                        unlocked
                          ? 'bg-amber-500/15 border-amber-400/50 text-white'
                          : 'bg-black border-[#2f3336] hover:border-amber-400 text-white'
                      }`}
                    >
                      <img
                        src={sp.imageUrl || sp.svg}
                        alt={sp.label}
                        className="w-6 h-6 object-cover rounded"
                      />
                      {unlocked ? (
                        <span className="text-[10px] text-emerald-400 font-bold">Açık</span>
                      ) : (
                        <span className="text-[10px] text-amber-300 font-black">{sp.cost}P</span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      const handleGoogleSignIn = async () => {
        setAuthError('');
        if (auth) {
          try {
            setAuthBusy(true);
            const provider = new GoogleAuthProvider();
            const res = await signInWithPopup(auth, provider);
            if (res?.user?.email) {
              completeGoogleAccountLogin(
                res.user.email,
                res.user.displayName || res.user.email.split('@')[0],
                res.user.photoURL || ''
              );
              return;
            }
          } catch {
            // Popup engellendiyse manuel Google ekranını aç
          } finally {
            setAuthBusy(false);
          }
        }
        setShowGoogleSimModal(true);
      };

      const handleSignOut = async () => {
        try {
          if (auth) await signOut(auth);
        } catch {}
        localStorage.removeItem(STORAGE_KEYS.ACTIVE_USER);
        setUser(null);
        setActiveNav('home');
      };

      const handleOpenUserProfile = (targetUid) => {
        if (!targetUid) return;
        setViewedProfileUid(targetUid);
        setActiveNav('profile');
      };

      const handleToggleFollow = (targetUid) => {
        if (!user || !currentProfile || targetUid === user.uid) return;
        const target = allUsers[targetUid];
        if (!target) return;

        const myFollowing = Array.isArray(currentProfile.following) ? currentProfile.following : [];
        const targetFollowers = Array.isArray(target.followers) ? target.followers : [];
        const alreadyFollowing = myFollowing.includes(targetUid);

        const nextMyFollowing = alreadyFollowing
          ? myFollowing.filter((id) => id !== targetUid)
          : [...myFollowing, targetUid];
        const nextTargetFollowers = alreadyFollowing
          ? targetFollowers.filter((id) => id !== user.uid)
          : [...targetFollowers, user.uid];

        persistUserUpdate(user.uid, { following: nextMyFollowing });
        persistUserUpdate(targetUid, { followers: nextTargetFollowers });
        showToast(
          alreadyFollowing
            ? `${target.displayName} takipten çıkarıldı.`
            : `${target.displayName} takip ediliyor!`
        );
      };

      const handleStartDirectMessage = (targetUid) => {
        const myFollowing = Array.isArray(currentProfile?.following) ? currentProfile.following : [];
        if (!myFollowing.includes(targetUid)) {
          showToast('Mesaj göndermek için önce bu kullanıcıyı takip etmelisin.');
          return;
        }
        setActiveDmPartnerUid(targetUid);
        setActiveNav('messages');
      };

      const handleSendDirectMessage = (e) => {
        e.preventDefault();
        if (!user || !activeDmPartnerUid || !dmInputText.trim()) return;
        const myFollowing = Array.isArray(currentProfile?.following) ? currentProfile.following : [];
        if (!myFollowing.includes(activeDmPartnerUid)) {
          showToast('Sadece takip ettiğin kişilere mesaj gönderebilirsin.');
          return;
        }
        const cleanMsg = dmInputText.trim();
        if (!canPostLinks && containsExternalLink(cleanMsg)) {
          showToast('Link atmanız yasaktır ve atmanız için yetkiniz yoktur.');
          return;
        }
        const dmObj = {
          id: `dm_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
          senderUid: user.uid,
          receiverUid: activeDmPartnerUid,
          text: cleanMsg,
          createdAt: Date.now()
        };
        setDirectMessages((prev) => {
          const updated = [...prev, dmObj];
          writeLocalStore(STORAGE_KEYS.DMS, updated);
          return updated;
        });
        if (db && auth?.currentUser) {
          addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'dms'), dmObj).catch(() => {});
        }
        setDmInputText('');
      };

      const handlePurchaseSubscription = () => {
        if (!user || !currentProfile) return;
        if (isSiteManager) {
          showToast('Site Yöneticisi için abonelik sınırsız açıktır.');
          return;
        }
        const pts = currentProfile.points || 0;
        if (pts < SUBSCRIPTION_COST) {
          showToast(`Abonelik için ${SUBSCRIPTION_COST} Puan gerekiyor! (Mevcut: ${pts}P)`);
          return;
        }
        persistUserUpdate(user.uid, {
          points: pts - SUBSCRIPTION_COST,
          subscriptionExpiresAt: Date.now() + THIRTY_DAYS_MS
        });
        showToast('1 Aylık w.kngl Aboneliğin aktif edildi!');
      };

      const handlePublishAnnouncement = (e) => {
        e.preventDefault();
        if (!canPublishAnnouncements || !user || !currentProfile || !announcementBody.trim()) return;
        const annObj = {
          id: `ann_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
          authorUid: user.uid,
          authorName: currentProfile.displayName,
          authorRole: currentProfile.role || 'mod',
          title: announcementTitle.trim() || 'Topluluk Duyurusu',
          body: announcementBody.trim(),
          createdAt: Date.now()
        };
        setAnnouncements((prev) => {
          const updated = [annObj, ...prev];
          writeLocalStore(STORAGE_KEYS.ANNOUNCEMENTS, updated);
          return updated;
        });
        if (db && auth?.currentUser) {
          addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'announcements'), annObj).catch(
            () => {}
          );
        }
        setAnnouncementTitle('');
        setAnnouncementBody('');
        showToast('Resmi duyuru yayınlandı!');
      };

      const handleDeleteAnnouncement = (annId) => {
        setAnnouncements((prev) => {
          const updated = prev.filter((a) => a.id !== annId);
          writeLocalStore(STORAGE_KEYS.ANNOUNCEMENTS, updated);
          return updated;
        });
        if (db && auth?.currentUser) {
          deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'announcements', annId)).catch(
            () => {}
          );
        }
      };

      const handleCreateEvent = (e) => {
        e.preventDefault();
        if (!canManageEventsAndWheels || !user || !currentProfile || !eventTitleInput.trim()) return;
        const evObj = {
          id: `ev_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
          authorUid: user.uid,
          authorName: currentProfile.displayName,
          title: eventTitleInput.trim(),
          description: eventDescInput.trim(),
          rewardType: eventRewardType,
          rewardPoints: Number(eventRewardPoints) || 500,
          rewardRole: eventRewardRole,
          rewardGiftText: eventRewardGiftText.trim(),
          participants: [],
          createdAt: Date.now()
        };
        setEventsList((prev) => {
          const updated = [evObj, ...prev];
          writeLocalStore(STORAGE_KEYS.EVENTS, updated);
          return updated;
        });
        if (db && auth?.currentUser) {
          addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'events'), evObj).catch(() => {});
        }
        setEventTitleInput('');
        setEventDescInput('');
        setEventRewardGiftText('');
        setShowCreateEventModal(false);
        showToast('Etkinlik oluşturuldu ve yayınlandı!');
      };

      const handleDeleteEvent = (evId) => {
        setEventsList((prev) => {
          const updated = prev.filter((x) => x.id !== evId);
          writeLocalStore(STORAGE_KEYS.EVENTS, updated);
          return updated;
        });
        if (db && auth?.currentUser) {
          deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', evId)).catch(() => {});
        }
      };

      const handleJoinEvent = (ev) => {
        if (!user || !currentProfile) return;
        const participants = Array.isArray(ev.participants) ? ev.participants : [];
        if (participants.includes(user.uid)) return;

        const nextParticipants = [...participants, user.uid];
        setEventsList((prev) => {
          const updated = prev.map((x) =>
            x.id === ev.id ? { ...x, participants: nextParticipants } : x
          );
          writeLocalStore(STORAGE_KEYS.EVENTS, updated);
          return updated;
        });
        if (db && auth?.currentUser) {
          updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', ev.id), {
            participants: nextParticipants
          }).catch(() => {});
        }

        if (ev.rewardType === 'points' && !isSiteManager) {
          const ptsGain = Number(ev.rewardPoints) || 0;
          persistUserUpdate(user.uid, { points: (currentProfile.points || 0) + ptsGain });
          showToast(`Etkinliğe katıldın ve +${ptsGain} Puan kazandın!`);
        } else if (ev.rewardType === 'role' && ev.rewardRole) {
          const nextRoles = Array.from(
            new Set([...normalizeUserRoles(currentProfile), ev.rewardRole])
          );
          persistUserUpdate(user.uid, { roles: nextRoles, role: nextRoles[0] || 'member' });
          showToast(
            `Etkinliğe katıldın ve ${ROLE_META[ev.rewardRole]?.label || ev.rewardRole} rolü kazandın!`
          );
        } else {
          showToast('Etkinliğe başarıyla katıldın!');
        }
      };

      const handleSegmentMediaUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 200, 200);
          setSegMediaUrl(dataUrl);
        } catch {
          showToast('Görsel yüklenemedi.');
        }
      };

      const handleAddSegmentToDraft = () => {

            : cw.period === 'month'
            ? 30 * TWENTY_FOUR_HOURS_MS
            : TWENTY_FOUR_HOURS_MS;
        const history = (currentProfile.customWheelHistory || {})[cw.id] || [];

        setActiveWheelSpinId(cw.id);
        setCustomWheelResult(null);

        const segs = cw.segments || [];
        const totalW = segs.reduce((acc, s) => acc + (s.weight || 10), 0);
        let roll = Math.random() * totalW;
        let chosen = segs[0];
        for (const s of segs) {
          roll -= s.weight || 10;
          if (roll <= 0) {
            chosen = s;
            break;
          }
        }

        const prevHist = (currentProfile.customWheelHistory || {})[cw.id] || [];
        const nextHistMap = {
          ...(currentProfile.customWheelHistory || {}),
          [cw.id]: [...prevHist, Date.now()]

        setTimeout(() => {
          setActiveWheelSpinId(null);
          setCustomWheelResult({ wheelId: cw.id, segment: chosen });
          const patch = { customWheelHistory: nextHistMap };

          'gift',
          `${currentProfile.displayName} sana +${amt} Puan hediye etti!`

          const maxH = fieldName === 'bannerUrl' ? 500 : 600;
          const dataUrl = await compressImageFile(file, maxW, maxH);
          if (fieldName === 'bannerUrl') {
            setEditForm((prev) => ({
              ...prev,
              bannerUrl: dataUrl,
              bannerZoom: 1,
              bannerPosX: 50,
              bannerPosY: 50

                  >
                    {wheelSpinning ? 'Çark Dönüyor...' : 'Şans Çarkını Çevir!'}
                  </button>
                ) : (
                  <div className="p-3.5 rounded-2xl bg-black border border-[#2f3336] space-y-1">
                    <div className="flex items-center justify-center gap-1.5 text-xs text-[#71767b]">
                      <Lock className="w-3.5 h-3.5 text-amber-400" />
                      <span>Günlük hakkını kullandın. Yenilenmesine kalan süre:</span>
                    </div>
                    <p className="text-2xl font-black font-mono text-amber-300">
                      {formatCountdown(wheelRemainingMs)}
                    </p>
                  </div>
                )}
              </div>
            </div>
          )}

          {giftTargetUser && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#16181c] border border-[#2f3336] rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-[#2f3336]">
                  <span className="font-bold text-white flex items-center gap-2">
                    <Gift className="w-5 h-5 text-amber-400" />
                    <span>Puan Hediye Et</span>
                  </span>
                  <button
                    onClick={() => setGiftTargetUser(null)}
                    className="p-1 rounded-full hover:bg-[#2f3336] text-[#71767b] hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <p className="text-xs text-[#71767b]">
                  <strong className="text-white">{giftTargetUser.displayName}</strong> adlı üyeye
                  gönderilecek puan miktarını seç:
                </p>
                <form onSubmit={handleSendPointGift} className="space-y-3">
                  <div className="grid grid-cols-4 gap-2">
                    {[25, 50, 100, 500].map((val) => (
                      <button
                        key={val}
                        type="button"
                        onClick={() => setGiftAmount(val)}
                        className={`py-2 rounded-xl font-extrabold text-xs border transition ${
                          Number(giftAmount) === val
                            ? 'bg-amber-500 text-black border-amber-400'
                            : 'bg-black text-white border-[#2f3336]'
                        }`}
                      >
                        +{val}P
                      </button>
                    ))}
                  </div>
                  <input
                    type="number"
                    min="1"
                    value={giftAmount}
                    onChange={(e) => setGiftAmount(e.target.value)}
                    className="w-full bg-black border border-[#2f3336] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                  />
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm transition"
                  >
                    Hediyeyi Gönder
                  </button>
                </form>
              </div>
            </div>
          )}

          {activeReplyingPost && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-black border border-[#2f3336] rounded-2xl w-full max-w-lg p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-[#2f3336]">
                  <span className="font-bold text-sm text-white">Yanıt Yaz</span>
                  <button
                    onClick={() => setReplyingToPostId(null)}
                    className="p-1.5 rounded-full hover:bg-[#181818] text-[#71767b] hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleSendReply} className="space-y-3">
                  <textarea
                    rows={3}
                    autoFocus
                    value={replyText}
                    onChange={(e) => setReplyText(e.target.value)}
                    placeholder="Yanıtını yaz..."
                    className="w-full bg-transparent text-white placeholder-[#71767b] outline-none resize-none text-sm"
                  />

                  {showReplyEmotes && renderEmotePickerGrid(setReplyText, 240)}

                  <div className="flex items-center justify-between pt-2 border-t border-[#2f3336]">
                    <button
                      type="button"
                      onClick={() => setShowReplyEmotes((prev) => !prev)}
                      className={`p-2 rounded-full ${theme.softBg} ${theme.text} hover:opacity-80`}
                    >
                      <Smile className="w-4 h-4" />
                    </button>
                    <button
                      type="submit"
                      disabled={!replyText.trim() || sendingReply}
                      className={`px-5 py-2 rounded-full ${theme.bg} ${theme.hoverBg} disabled:opacity-40 text-white font-bold text-xs`}
                    >
                      Yanıtla
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isEditProfileOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-black border border-[#2f3336] rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-2 border-b border-[#2f3336]">
                  <span className="font-bold text-base text-white">Profili Düzenle</span>
                  <button
                    onClick={() => setIsEditProfileOpen(false)}
                    className="p-1.5 rounded-full hover:bg-[#181818] text-[#71767b] hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveProfile} className="space-y-4">
                  {/* CANLI ÖNİZLEME + YAKINLAŞTIRMA & ODAK AYARI */}
                  <div className="rounded-2xl border border-[#2f3336] overflow-hidden bg-[#16181c]">
                    <div className="h-24 relative overflow-hidden bg-gradient-to-r from-[#1d9bf0]/30 via-[#7856ff]/30 to-[#00ba7c]/20">
                      {editForm.bannerUrl && (
                        <img
                          src={editForm.bannerUrl}
                          alt="Kapak Önizleme"
                          style={{
                            objectPosition: `${editForm.bannerPosX}% ${editForm.bannerPosY}%`,
                            transform: `scale(${editForm.bannerZoom})`,
                            transformOrigin: `${editForm.bannerPosX}% ${editForm.bannerPosY}%`
                          }}
                          className="w-full h-full object-cover"
                        />
                      )}
                    </div>
                    <div className="px-4 pb-3 -mt-9 flex items-end justify-between">
                      <div className="w-16 h-16 rounded-full border-4 border-black overflow-hidden bg-black flex items-center justify-center">
                        {editForm.avatarUrl ? (
                          <img
                            src={editForm.avatarUrl}
                            alt="PP Önizleme"
                            style={{
                              objectPosition: `${editForm.avatarPosX}% ${editForm.avatarPosY}%`,
                              transform: `scale(${editForm.avatarZoom})`,
                              transformOrigin: `${editForm.avatarPosX}% ${editForm.avatarPosY}%`
                            }}
                            className="w-full h-full object-cover"
                          />
                        ) : (
                          <div
                            className={`w-full h-full ${getAvatarBgClass(
                              editForm.avatarColor
                            )} flex items-center justify-center font-extrabold text-white text-lg`}
                          >
                            {getInitials(editForm.displayName)}
                          </div>
                        )}
                      </div>
                      <span className="text-[11px] text-[#71767b] font-semibold">Canlı Önizleme</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1.5">
                      <label className="text-xs text-[#71767b] block">Profil Fotoğrafı</label>
                      <label className="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl bg-[#16181c] border border-[#2f3336] hover:border-[#1d9bf0] text-xs font-bold text-white cursor-pointer">
                        <Camera className="w-4 h-4 text-[#1d9bf0]" />
                        <span>PP Fotoğrafı Seç</span>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => handleProfileImageUpload(e, 'avatarUrl')}
                          className="hidden"
                        />
                      </label>
                      {editForm.avatarUrl && (
                        <button
                          type="button"
                          onClick={() =>
                            setEditForm((prev) => ({
                              ...prev,
                              avatarUrl: '',
                              avatarZoom: 1,
                              avatarPosX: 50,
                              avatarPosY: 50
                            }))
                          }
                          className="text-[11px] text-red-400 hover:underline"
                        >
                          PP Fotoğrafını Kaldır
                        </button>
                      )}
                    </div>

                    <div className="space-y-1.5">
                      <label className="text-xs text-[#71767b] block">Arka Plan Kapağı</label>
                      <label className="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl bg-[#16181c] border border-[#2f3336] hover:border-[#1d9bf0] text-xs font-bold text-white cursor-pointer">
                        <ImageIcon className="w-4 h-4 text-emerald-400" />
                        <span>Kapak Fotoğrafı</span>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => handleProfileImageUpload(e, 'bannerUrl')}
                          className="hidden"
                        />
                      </label>
                      {editForm.bannerUrl && (
                        <button
                          type="button"
                          onClick={() =>
                            setEditForm((prev) => ({
                              ...prev,
                              bannerUrl: '',
                              bannerZoom: 1,
                              bannerPosX: 50,
                              bannerPosY: 50
                            }))
                          }
                          className="text-[11px] text-red-400 hover:underline"
                        >
                          Kapağı Kaldır
                        </button>
                      )}
                    </div>
                  </div>

                  {editForm.avatarUrl && (
                    <div className="p-3 rounded-xl bg-[#16181c] border border-[#2f3336] space-y-2 text-xs">
                      <p className="font-bold text-white">Profil Fotoğrafı Konum & Yakınlaştırma</p>
                      <div className="space-y-1">
                        <div className="flex justify-between text-[#71767b]">
                          <span>Yakınlaştır (Zoom)</span>
                          <span>{Number(editForm.avatarZoom).toFixed(1)}x</span>
                        </div>
                        <input
                          type="range"
                          min="1"
                          max="2.5"
                          step="0.1"
                          value={editForm.avatarZoom}
                          onChange={(e) =>
                            setEditForm((prev) => ({ ...prev, avatarZoom: Number(e.target.value) }))
                          }
                          className="w-full accent-[#1d9bf0]"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <span className="text-[#71767b]">Yatay Odak: %{editForm.avatarPosX}</span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            value={editForm.avatarPosX}
                            onChange={(e) =>
                              setEditForm((prev) => ({
                                ...prev,
                                avatarPosX: Number(e.target.value)
                              }))
                            }
                            className="w-full accent-[#1d9bf0]"
                          />
                        </div>
                        <div>
                          <span className="text-[#71767b]">Dikey Odak: %{editForm.avatarPosY}</span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            value={editForm.avatarPosY}
                            onChange={(e) =>
                              setEditForm((prev) => ({
                                ...prev,
                                avatarPosY: Number(e.target.value)
                              }))
                            }
                            className="w-full accent-[#1d9bf0]"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {editForm.bannerUrl && (
                    <div className="p-3 rounded-xl bg-[#16181c] border border-[#2f3336] space-y-2 text-xs">
                      <p className="font-bold text-white">Arka Plan Kapağı Konum & Yakınlaştırma</p>
                      <div className="space-y-1">
                        <div className="flex justify-between text-[#71767b]">
                          <span>Yakınlaştır (Zoom)</span>
                          <span>{Number(editForm.bannerZoom).toFixed(1)}x</span>
                        </div>
                        <input
                          type="range"
                          min="1"
                          max="2.5"
                          step="0.1"
                          value={editForm.bannerZoom}
                          onChange={(e) =>
                            setEditForm((prev) => ({ ...prev, bannerZoom: Number(e.target.value) }))
                          }
                          className="w-full accent-emerald-400"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <span className="text-[#71767b]">Yatay Odak: %{editForm.bannerPosX}</span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            value={editForm.bannerPosX}
                            onChange={(e) =>
                              setEditForm((prev) => ({
                                ...prev,
                                bannerPosX: Number(e.target.value)
                              }))
                            }
                            className="w-full accent-emerald-400"
                          />
                        </div>
                        <div>
                          <span className="text-[#71767b]">Dikey Odak: %{editForm.bannerPosY}</span>
                          <input
                            type="range"
                            min="0"
                            max="100"
                            value={editForm.bannerPosY}
                            onChange={(e) =>
                              setEditForm((prev) => ({
                                ...prev,
                                bannerPosY: Number(e.target.value)
                              }))
                            }
                            className="w-full accent-emerald-400"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Görünen Ad</label>
                    <input
                      type="text"
                      value={editForm.displayName}
                      onChange={(e) => setEditForm({ ...editForm, displayName: e.target.value })}
                      className="w-full bg-[#16181c] border border-[#2f3336] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Kullanıcı Adı</label>
                    <input
                      type="text"
                      value={editForm.handle}
                      onChange={(e) => setEditForm({ ...editForm, handle: e.target.value })}
                      className="w-full bg-[#16181c] border border-[#2f3336] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1">Biyografi</label>
                    <textarea
                      rows={2}
                      value={editForm.bio}
                      onChange={(e) => setEditForm({ ...editForm, bio: e.target.value })}
                      className="w-full bg-[#16181c] border border-[#2f3336] rounded-xl px-3.5 py-2 text-sm text-white outline-none resize-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1.5">
                      Nick (İsim) Rengi Seçimi
                    </label>
                    <div className="flex flex-wrap gap-2">
                      {NICK_COLORS.map((nc) => (
                        <button
                          key={nc.id}
                          type="button"
                          onClick={() => setEditForm({ ...editForm, nickColor: nc.id })}
                          className={`px-3 py-1.5 rounded-full text-xs font-extrabold border flex items-center gap-1.5 transition ${
                            editForm.nickColor === nc.id
                              ? 'bg-[#202327] border-white text-white scale-105'
                              : 'bg-[#16181c] border-[#2f3336] text-[#71767b] hover:text-white'
                          }`}
                        >
                          <span
                            style={{ backgroundColor: nc.swatch }}
                            className="w-3 h-3 rounded-full inline-block"
                          />
                          <span className={nc.className}>{nc.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-[#71767b] block mb-1.5">Avatar Rengi</label>
                    <div className="flex gap-2.5">
                      {AVATAR_COLORS.map((c) => (
                        <button
                          key={c.id}
                          type="button"
                          onClick={() => setEditForm({ ...editForm, avatarColor: c.id })}
                          className={`w-8 h-8 rounded-full ${c.bg} ${
                            editForm.avatarColor === c.id ? 'ring-2 ring-white scale-110' : 'opacity-70'
                          }`}
                        />
                      ))}
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-full bg-white text-black font-extrabold text-sm hover:bg-gray-200 transition"
                  >
                    Değişiklikleri Kaydet
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
